<!doctype html>
<!--
  The WebAssembly port's page (emcc --shell-file; docs/PORT.md, "WebAssembly").
  After DozerEncore's port/web/shell.html (the same author's, AGPL-3.0:
  NOTICES.md).  The ROM is the player's own: picked once, it is kept in
  IndexedDB with the save (IDBFS at /save), and main() runs once it is there.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuse64</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #111; --fg: #ddd; --dim: #888; --accent: #e85030; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
               font: 14px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; }
  #stage { flex: 1; width: 100%; min-height: 0; position: relative; background: #000; }
  canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block;
           background: #000; outline: none; touch-action: none; user-select: none;
           object-fit: contain; image-rendering: pixelated; }
  #panel { padding: 0.6em 16px; text-align: center; max-width: 100%; box-sizing: border-box; }
  button, .file { background: var(--accent); color: #111; border: 0; border-radius: 4px;
                  padding: 0.4em 1em; font: inherit; cursor: pointer; }
  .file input { display: none; }
  #status { color: var(--dim); margin-top: 0.3em; min-height: 1.4em; }
  #keys { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas></div>
<div id="panel">
  <div id="start">
    <label class="file">Choose your ROM (.z64/.v64/.n64)<input type="file" id="rom" accept=".z64,.v64,.n64,.rom,.bin"></label>
    <button id="play" hidden>Play</button>
    <button id="forget" hidden>Forget the ROM</button>
  </div>
  <div id="status">Loading...</div>
  <button id="full" hidden>Full screen</button>
  <button id="reset" hidden>Reset</button>
  <div id="keys">Arrows = the stick, X or Space = A, C or Ctrl = B, Z = Z, A/S = L/R, Enter = START, F9 = the reset button; a gamepad works too.  Click the picture for the keyboard.</div>
</div>
<script>
  var statusEl = document.getElementById('status');
  function status(s) { statusEl.textContent = s; }
  var ROM = '/save/rom.z64';
  var ready = false, started = false, syncTimer = 0;
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (s) { console.log(s); },
    printErr: function (s) { console.warn(s); if (/^fuse64:/.test(s)) status(s); },
    setStatus: function (s) { if (!started && s) status(s); },
    onRuntimeInitialized: function () {
      FS.mkdir('/save');
      FS.mount(Module.IDBFS || IDBFS, {}, '/save');
      FS.syncfs(true, function (err) {
        if (err) console.warn('IndexedDB:', err);
        ready = true;
        /* ?rom=URL: the ROM from there (your own copy, on your own server) */
        var url = new URLSearchParams(location.search).get('rom');
        if (url) {
          status('Fetching ' + url + '...');
          fetch(url).then(function (r) {
            if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
            return r.arrayBuffer();
          }).then(function (buf) {
            FS.writeFile(ROM, new Uint8Array(buf));
            FS.syncfs(false, function () { haveRom(); });
          }).catch(function (e) { status('Fetching ' + url + ': ' + e.message); });
          return;
        }
        haveRom();
      });
    },
    /* the game wrote its EEPROM (port/host/saves.c): to IndexedDB, once the burst is over */
    syncSave: function () {
      clearTimeout(syncTimer);
      syncTimer = setTimeout(function () {
        FS.syncfs(false, function (err) { if (err) console.warn('saving:', err); });
      }, 500);
    },
  };
  function exists(p) {
    try { return FS.stat(p).size > 0; } catch (e) { return false; }
  }
  function haveRom() {
    var rom = exists(ROM);
    document.getElementById('play').hidden = !rom;
    document.getElementById('forget').hidden = !rom;
    status(rom ? 'The ROM is ready.' : 'Choose your Bomberman 64 ROM (it stays in this browser).');
  }
  document.getElementById('forget').onclick = function () {
    try { FS.unlink(ROM); } catch (e) {}
    FS.syncfs(false, function () { haveRom(); });
  };
  function start() {
    if (started || !ready) return;
    started = true;
    document.getElementById('start').hidden = true;
    var args = ['--save-dir', '/save'];
    /* more from the address: ?args=-v */
    var q = new URLSearchParams(location.search);
    if (q.get('args')) args = args.concat(q.get('args').split(' ').filter(Boolean));
    args.push(ROM);
    status('Running. Click the picture for the keyboard.');
    document.getElementById('full').hidden = !document.fullscreenEnabled;
    document.getElementById('reset').hidden = false;
    Module.canvas.focus();
    Module.callMain(args);
  }
  document.getElementById('play').onclick = start;
  document.getElementById('rom').onchange = function (e) {
    var f = e.target.files[0];
    if (!f || !ready) return;
    status('Reading ' + f.name + '...');
    f.arrayBuffer().then(function (buf) {
      FS.writeFile(ROM, new Uint8Array(buf));
      FS.syncfs(false, function () { start(); });
    });
  };
  Module.canvas.addEventListener('click', function () { Module.canvas.focus(); });
  /* the browser may start the sound suspended: any input is a chance to resume it */
  function resumeAudio() {
    var ac = Module.SDL2 && Module.SDL2.audioContext;
    if (ac && ac.state !== 'running' && ac.state !== 'closed') ac.resume();
  }
  ['keydown', 'pointerdown', 'touchstart'].forEach(function (e) { addEventListener(e, resumeAudio, true); });
  /* the console's reset button (port/host/main.c, docs/PORT.md "The reset button") */
  document.getElementById('reset').onclick = function () {
    Module._host_reset_button();
    Module.canvas.focus();
  };
  document.getElementById('full').onclick = function () {
    document.getElementById('stage').requestFullscreen().then(function () {
      Module.canvas.focus();
    }).catch(function (e) { status('Full screen: ' + e.message); });
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
